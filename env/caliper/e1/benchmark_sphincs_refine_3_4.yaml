test:
  name: E1 SPHINCS+ Sustainable-Rate Boundary Refinement
  description: Optional 3/4 TPS refinement after analysis of the preregistered low-rate sweep
  workers:
    type: local
    number: 1

  rounds:
    - label: warmup
      description: Warm-up round; results are discarded
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: warmup

    - label: sphincs-3-tps
      description: Offer 3 TPS for 60 seconds
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: sphincs-3-tps

    - label: sphincs-4-tps
      description: Offer 4 TPS for 60 seconds
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: sphincs-4-tps

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - peer1.org1.example.com
          - peer0.org2.example.com
          - peer1.org2.example.com

