test:
  name: E1 SPHINCS+ Sustainable-Rate Boundary Probe at 35 TPS
  description: Single midpoint probe between the sustainable 20 TPS result and common-profile saturation at 50 TPS
  workers:
    type: local
    number: 1

  rounds:
    - label: warmup
      description: Warm-up round; results are discarded
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: warmup

    - label: sphincs-35-tps
      description: Offer 35 TPS for 60 seconds
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 35
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: sphincs-35-tps

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - peer1.org1.example.com
          - peer0.org2.example.com
          - peer1.org2.example.com
