test:
  name: E1 ECDSA Sustainable-Rate Probe at 222 TPS
  description: Single 60-second ECDSA probe using the preregistered sustainability criteria
  workers:
    type: local
    number: 1

  rounds:
    - label: warmup
      description: Warm-up round; results are discarded
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: warmup

    - label: sustained-222-tps
      description: Offer 222 TPS for 60 seconds
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 222
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: sustained-222-tps

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - peer1.org1.example.com
          - peer0.org2.example.com
          - peer1.org2.example.com
