test:
  name: E1 Fabric Identity Benchmark
  description: Fixed workload profile for E1 identity comparison
  workers:
    type: local
    number: 1

  rounds:
    - label: warmup
      description: Warm-up round; results are discarded
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: warmup

    - label: 50-tps
      description: Send transactions at 50 TPS for 2 minutes
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: 50-tps

    - label: 200-tps
      description: Send transactions at 200 TPS for 2 minutes
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: 200-tps

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - peer1.org1.example.com
          - peer0.org2.example.com
          - peer1.org2.example.com
