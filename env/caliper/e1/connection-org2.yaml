name: E1 Org2 Connection Profile
version: "1.0.0"

client:
  organization: Org2MSP

organizations:
  Org2MSP:
    mspid: Org2MSP
    peers:
      - peer0.org2.example.com
      - peer1.org2.example.com

peers:
  peer0.org2.example.com:
    url: grpcs://peer0.org2.example.com:9051
    tlsCACerts:
      path: ../../fabric/e1/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer0.org2.example.com
      hostnameOverride: peer0.org2.example.com

  peer1.org2.example.com:
    url: grpcs://peer1.org2.example.com:10051
    tlsCACerts:
      path: ../../fabric/e1/crypto-config/peerOrganizations/org2.example.com/peers/peer1.org2.example.com/tls/ca.crt
    grpcOptions:
      ssl-target-name-override: peer1.org2.example.com
      hostnameOverride: peer1.org2.example.com
