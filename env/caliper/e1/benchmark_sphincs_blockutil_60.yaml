test:
  name: E1 SPHINCS+ Block-Filling Diagnostic at 60 TPS
  description: Diagnostic only; tests whether unchanged Fabric parameters produce volume-driven blocks
  workers:
    type: local
    number: 1

  rounds:
    - label: warmup
      description: Warm-up round; results are discarded
      txDuration: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: warmup

    - label: blockutil-60-tps
      description: Offer 60 TPS for 60 seconds solely to inspect the resulting block-cutting regime
      txDuration: 60
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: workload/set.js
        arguments:
          contractId: simplekv
          roundLabel: blockutil-60-tps

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        containers:
          - orderer.example.com
          - peer0.org1.example.com
          - peer1.org1.example.com
          - peer0.org2.example.com
          - peer1.org2.example.com
